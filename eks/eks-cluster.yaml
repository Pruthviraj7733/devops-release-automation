apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: "devops-release-cluster"
  region: ap-south-1
  version: "1.36"

vpc:
  id: vpc-08ac85601b95884a7
  subnets:
    public:
      ap-south-1a:
        id: subnet-0a4485df057f56971
      ap-south-1b:
        id: subnet-0fd69871867940b8f

managedNodeGroups:
  - name: devops-worker-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    privateNetworking: false
    volumeSize: 20
    ssh:
      allow: false
